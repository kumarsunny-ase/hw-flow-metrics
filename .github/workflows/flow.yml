name: hw-flow

# Runs simulation + synthesis on every push and pull request,
# then stores the metrics and the dashboard as downloadable artifacts.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  flow:
    runs-on: ubuntu-24.04   # 24.04 ships Verilator 5.x, which supports --binary
    steps:
      - uses: actions/checkout@v4

      - name: Install EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run flow (simulation + synthesis + metrics)
        run: python3 scripts/run_flow.py

      - name: Build dashboard
        if: always()
        run: python3 scripts/dashboard.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-reports
          path: |
            build/*.log
            build/run_metrics.json
            build/synth_stat.txt
            reports/dashboard.html
